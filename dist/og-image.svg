<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#1a1a1a"/>
  
  <!-- Gradient overlay -->
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#2a2a2a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a1a;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#grad)"/>
  
  <!-- Orange accent line -->
  <rect x="0" y="0" width="1200" height="8" fill="#FF6B00"/>
  
  <!-- Logo matching favicon design -->
  <!-- Outer glow -->
  <circle cx="600" cy="150" r="90" fill="#FF6B00" opacity="0.1"/>
  <circle cx="600" cy="150" r="75" fill="#FF6B00" opacity="0.2"/>
  
  <!-- Main drill bit circle -->
  <circle cx="600" cy="150" r="60" fill="#FF6B00"/>
  
  <!-- Inner drill center -->
  <circle cx="600" cy="150" r="30" fill="#1a1a1a"/>
  <circle cx="600" cy="150" r="15" fill="#FF6B00"/>
  
  <!-- Letter C (scaled from favicon) -->
  <path d="M 630 125 A 30 30 0 0 1 630 175" stroke="#fff" stroke-width="10" fill="none" stroke-linecap="round"/>
  
  <!-- Main title - Line 1 -->
  <text x="600" y="300" font-family="Arial, sans-serif" font-size="56" font-weight="bold" fill="white" text-anchor="middle">CAROTARE ȘI TĂIERE BETON</text>
  
  <!-- Subtitle - Location -->
  <text x="600" y="360" font-family="Arial, sans-serif" font-size="42" fill="#FF6B00" text-anchor="middle">Suceava și Botoșani</text>
  
  <!-- Materials -->
  <text x="600" y="420" font-family="Arial, sans-serif" font-size="28" fill="#cccccc" text-anchor="middle">BETON • CĂRĂMIDĂ • BCA • ASFALT • PIATRĂ</text>
  
  <!-- Divider line -->
  <rect x="400" y="450" width="400" height="2" fill="#FF6B00" opacity="0.3"/>
  
  <!-- Phone number -->
  <text x="600" y="510" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="white" text-anchor="middle">📞 0758 663 415</text>
  
  <!-- Website -->
  <text x="600" y="570" font-family="Arial, sans-serif" font-size="32" fill="#999999" text-anchor="middle">carotaretaierebeton.ro</text>
</svg>