<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#1a1a1a"/>
  
  <!-- Gradient overlay -->
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#2a2a2a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a1a;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#grad)"/>
  
  <!-- Orange accent line -->
  <rect x="0" y="0" width="1200" height="8" fill="#FF6B00"/>
  
  <!-- Drill icon -->
  <circle cx="600" cy="180" r="80" fill="#FF6B00" opacity="0.2"/>
  <circle cx="600" cy="180" r="60" fill="#FF6B00"/>
  <text x="600" y="210" font-family="Arial, sans-serif" font-size="80" font-weight="bold" fill="white" text-anchor="middle">C</text>
  
  <!-- Main title -->
  <text x="600" y="320" font-family="Arial, sans-serif" font-size="62" font-weight="bold" fill="white" text-anchor="middle">CAROTAJ BETON</text>
  
  <!-- Subtitle -->
  <text x="600" y="380" font-family="Arial, sans-serif" font-size="38" fill="#cccccc" text-anchor="middle">Suceava și Botoșani</text>
  
  <!-- Service line -->
  <text x="600" y="440" font-family="Arial, sans-serif" font-size="28" fill="#FF6B00" text-anchor="middle">Tăieri și Carotări Profesionale</text>
  
  <!-- Phone -->
  <rect x="400" y="480" width="400" height="70" rx="35" fill="#FF6B00"/>
  <text x="600" y="530" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="white" text-anchor="middle">☎ 0758 663 415</text>
  
  <!-- Website -->
  <text x="600" y="590" font-family="Arial, sans-serif" font-size="24" fill="#999999" text-anchor="middle">solutiibeton.ro</text>
</svg>